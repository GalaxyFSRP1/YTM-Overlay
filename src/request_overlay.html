<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viewer requests · OBS</title><style>
:root{--accent:#ff5278}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f8f7ff;font:15px/1.3 'Segoe UI',Arial,sans-serif}#panel{display:none;width:min(100%,650px);max-height:100%;padding:18px 20px;background:linear-gradient(135deg,rgba(26,24,38,.94),rgba(17,18,27,.93));border:1px solid rgba(255,255,255,.13);border-radius:18px;box-shadow:0 12px 35px #0006}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.heading{font-size:20px;font-weight:750;letter-spacing:-.025em}.badge{border-radius:50%;background:var(--accent);color:#fff;width:31px;height:31px;text-align:center;line-height:31px;font-weight:bold}.item{display:flex;align-items:center;gap:12px;border-top:1px solid #ffffff16;padding:10px 0}.number{display:flex;align-items:center;justify-content:center;flex:none;background:#393047;color:#f3c7d1;border-radius:10px;width:32px;height:32px;font-size:12px;font-weight:800}.info{min-width:0;flex:1}.song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.meta{font-size:11px;color:#b3b4c4;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:10px;font-weight:700;color:#9cd9bb;white-space:nowrap}
</style></head><body><div id="panel"><header><div><div class="eyebrow">From the community</div><div class="heading">Viewer requests</div></div><span class="badge" id="count">0</span></header><div id="items"></div></div><script>
'use strict';const params=new URLSearchParams(location.search),demo=params.get('demo')==='1',anonymous=params.get('anonymous')==='1';
const rawMax=Number(params.get('max')),maxRows=Number.isInteger(rawMax)&&rawMax>=1&&rawMax<=8?rawMax:8;
const accent=params.get('accent')||'';if(/^[0-9a-f]{6}$/i.test(accent))document.documentElement.style.setProperty('--accent','#'+accent);
const names={twitch:'Twitch',youtube:'YouTube Live',kick:'Kick',manual:'Streamer'};
function node(tag,cls,text){const e=document.createElement(tag);e.className=cls;e.textContent=text;return e}
let last={items:[]};
function draw(data){last=data;const all=Array.isArray(data.items)?data.items:[];const fits=Math.max(1,Math.min(maxRows,Math.floor((window.innerHeight-85)/53)));const list=all.slice(0,fits);document.getElementById('panel').style.display=list.length?'block':'none';document.getElementById('count').textContent=String(Number.isFinite(data.total)?data.total:all.length);const root=document.getElementById('items');root.replaceChildren();list.forEach((x,i)=>{const item=node('div','item',''),info=node('div','info','');let song=String(x.song||'');if(/^https:\/\/music\.youtube\.com\/watch\?v=/.test(song))song='YouTube video · '+song.split('v=')[1];const platform=names[x.platform]||x.platform;info.append(node('div','song',song),node('div','meta',anonymous?platform:platform+' · requested by '+x.viewer));item.append(node('span','number',String(i+1).padStart(2,'0')),info,node('span','tag',x.status==='added'?'IN PLAYER':x.status==='adding'?'ADDING':'APPROVED'));root.append(item)});}
window.addEventListener('resize',()=>draw(last));
async function update(){try{const r=await fetch('/api/request-overlay',{cache:'no-store'});if(r.ok)draw(await r.json())}catch(e){}}
if(demo)draw({items:[{song:'A song for the stream',viewer:'musiclover',platform:'twitch',status:'added'},{song:'Another great request',viewer:'chatfriend',platform:'youtube',status:'ready'}]});else{update();setInterval(update,2000)}
</script></body></html>
