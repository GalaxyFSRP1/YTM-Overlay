name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core regression checks
        run: dotnet run --project tests/OverlayTests.csproj -c Release
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser fixtures
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/OverlayTests.csproj -c Release --no-build -- serve 7511 > "$RUNNER_TEMP/overlay-test-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:7511/api/state > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/overlay-test-server.log"; exit 1; fi
          export OVERLAY_PREVIEWS="$RUNNER_TEMP/overlay-previews"
          python tests/browser_tests.py
          python tests/browser_clock_tests.py
          python tests/request_browser_tests.py
          python tests/v001_browser_tests.py

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish Windows x64 single-file build
        run: dotnet publish src/YtmOverlay.csproj -c Release -r win-x64 --self-contained true -o release-output
      - name: Name, checksum and include notices for this build
        shell: pwsh
        run: |
          Move-Item release-output/YTM-Overlay.exe release-output/YTM-Overlay-v0.0.1-beta.exe
          $hash = (Get-FileHash release-output/YTM-Overlay-v0.0.1-beta.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  YTM-Overlay-v0.0.1-beta.exe" | Out-File release-output/SHA256SUMS.txt -Encoding ascii
          python tools/make_notices.py src/obj/project.assets.json src/bin/Release/net10.0-windows10.0.19041.0/win-x64/YTM-Overlay.runtimeconfig.json release-output/NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: YTM-Overlay-v0.0.1-beta-win-x64
          path: |
            release-output/YTM-Overlay-v0.0.1-beta.exe
            release-output/SHA256SUMS.txt
            release-output/NOTICES.txt
